<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notebook Reader</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/notebook-view.css" />
  </head>
  <body class="notebook-page">
    <header class="topbar notebook-topbar">
      <a class="brand" href="course-library.html?id=ibm-ai-engineering" aria-label="Back to Course Library">
        <span class="brand-mark" aria-hidden="true">AI</span>
        <span>Notebook Reader</span>
      </a>
      <nav class="notebook-nav">
        <a id="back-to-library" href="course-library.html?id=ibm-ai-engineering">← Back to Course Library</a>
        <a id="open-github-raw" href="#" target="_blank" rel="noreferrer">Raw source file</a>
        <a id="open-colab-link" href="#" target="_blank" rel="noreferrer" class="btn-colab">Open in Colab</a>
      </nav>
    </header>

    <main class="notebook-main">
      <div id="notebook-loading" class="notebook-loading">
        <div class="spinner"></div>
        <h2>Loading Notebook...</h2>
        <p>Fetching and generating detailed explanation for this section.</p>
      </div>

      <article id="notebook-card" class="notebook-card" hidden>
        <header class="notebook-card-header">
          <div class="notebook-badge" id="notebook-kind">COURSE NOTEBOOK</div>
          <h1 id="notebook-title">Loading...</h1>
          <p id="notebook-subtitle" class="notebook-subtitle"></p>
        </header>

        <section id="notebook-content" class="notebook-content">
          <!-- Rendered Markdown & Code Blocks -->
        </section>
      </article>
    </main>

    <script src="assets/js/notebook-view/app.js"></script>
  </body>
</html>
